<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📅 History - Victim Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-gradient-to-r from-red-700 to-rose-700 text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-3xl">📅</span>
      <div>
        <h1 class="text-xl font-bold">HISTORY & LOGS</h1>
        <p class="text-xs opacity-80">ดูย้อนหลัง - บันทึกกิจกรรมของ Server</p>
      </div>
    </div>
    <a href="/victim.html" class="bg-white text-red-700 px-4 py-2 rounded-lg font-semibold hover:bg-red-50 text-sm">
      ← กลับ Dashboard
    </a>
  </div>
</header>

<main class="max-w-7xl mx-auto p-6 grid grid-cols-12 gap-5">

  <!-- Sidebar -->
  <section class="col-span-12 md:col-span-3 bg-white rounded-xl shadow-md p-5">
    <h2 class="font-bold text-lg mb-3">📆 เลือกวันที่</h2>
    <div id="dateList" class="space-y-2 max-h-96 overflow-y-auto">
      <div class="text-gray-400 text-sm">กำลังโหลด...</div>
    </div>

    <div class="mt-4 pt-4 border-t">
      <button id="btnRefresh" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-blue-700">
        🔄 รีเฟรช
      </button>
      <button id="btnExport" class="w-full bg-gray-200 px-4 py-2 rounded-lg font-semibold text-sm mt-2 hover:bg-gray-300">
        📥 ดาวน์โหลด Log
      </button>
    </div>
  </section>

  <!-- Main -->
  <section class="col-span-12 md:col-span-9 space-y-5">

    <!-- Summary -->
    <div id="summaryCards" class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="bg-white rounded-xl shadow p-4 border">
        <div class="text-xs text-gray-500">เหตุการณ์</div>
        <div id="statEvents" class="text-2xl font-bold text-blue-700">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 border">
        <div class="text-xs text-gray-500">ถูกบล็อก</div>
        <div id="statBlocks" class="text-2xl font-bold text-red-600">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 border">
        <div class="text-xs text-gray-500">น่าสงสัย</div>
        <div id="statWarns" class="text-2xl font-bold text-amber-600">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 border">
        <div class="text-xs text-gray-500">Peak req/s</div>
        <div id="statPeak" class="text-2xl font-bold text-purple-700">0</div>
      </div>
      <div class="bg-white rounded-xl shadow p-4 border">
        <div class="text-xs text-gray-500">IP ที่โจมตี</div>
        <div id="statIPs" class="text-2xl font-bold text-gray-700">0</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="bg-white rounded-xl shadow-md p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">📈 Traffic Timeline</h2>
        <span id="selectedDate" class="text-sm text-gray-500">—</span>
      </div>
      <div class="h-72">
        <canvas id="historyChart"></canvas>
      </div>
    </div>

    <!-- Top Attackers -->
    <div class="bg-white rounded-xl shadow-md p-5">
      <h2 class="font-bold text-lg mb-3">🎯 Top Attackers</h2>
      <div id="topAttackers" class="flex flex-wrap gap-2">
        <div class="text-gray-400 text-sm">ไม่มีข้อมูล</div>
      </div>
    </div>

    <!-- Events Table -->
    <div class="bg-white rounded-xl shadow-md p-5">
      <h2 class="font-bold text-lg mb-3">📜 เหตุการณ์ในวันนั้น</h2>
      <div class="max-h-96 overflow-y-auto">
        <table class="w-full text-sm">
          <thead class="text-gray-500 text-xs uppercase sticky top-0 bg-white">
            <tr>
              <th class="text-left py-2">เวลา</th>
              <th class="text-left">ประเภท</th>
              <th class="text-left">IP</th>
              <th class="text-left">รายละเอียด</th>
            </tr>
          </thead>
          <tbody id="eventTable"></tbody>
        </table>
        <div id="eventEmpty" class="text-center text-gray-400 py-6 text-sm">ไม่มีเหตุการณ์</div>
      </div>
    </div>

  </section>

</main>

<script src="/history.js"></script>
</body>
</html>
